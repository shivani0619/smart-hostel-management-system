<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SmartHostel AI | Parent Forgot Password</title>

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Poppins", sans-serif;
            background: #f8f6f0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            color: #182235;
            overflow-x: hidden;
        }

        /* BACKGROUND GLOW */

        .glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            pointer-events: none;
        }

        .glow-one {
            width: 280px;
            height: 280px;
            background: #dcdcff;
            top: -80px;
            left: -70px;
        }

        .glow-two {
            width: 300px;
            height: 300px;
            background: #e8ddff;
            right: -100px;
            bottom: -100px;
        }

        /* BACK BUTTON */

        .back-button {
            position: fixed;
            top: 25px;
            left: 30px;

            display: inline-flex;
            align-items: center;
            gap: 8px;

            color: #596273;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;

            z-index: 10;
        }

        .back-button:hover {
            color: #5b5ce2;
        }

        /* MAIN CARD */

        .forgot-container {
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 2;
        }

        .forgot-card {
            background: #ffffff;
            border: 1px solid #eeeeee;
            border-radius: 22px;
            padding: 38px;
            box-shadow: 0 18px 45px rgba(24, 34, 53, 0.08);
        }

        /* HEADER */

        .card-heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .parent-icon {
            width: 62px;
            height: 62px;
            margin: 0 auto 16px;

            border-radius: 16px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #f0efff;
            color: #5b5ce2;

            font-size: 25px;
        }

        .card-heading h2 {
            font-size: 25px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .card-heading p {
            font-size: 13px;
            line-height: 1.6;
            color: #7c8494;
        }

        /* STEP */

        .step-title {
            display: flex;
            align-items: center;
            gap: 9px;

            margin-bottom: 20px;

            font-size: 15px;
            font-weight: 600;
            color: #182235;
        }

        .step-number {
            width: 28px;
            height: 28px;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #5b5ce2;
            color: #ffffff;

            font-size: 12px;
            font-weight: 600;
        }

        /* INPUT */

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;

            font-size: 13px;
            font-weight: 500;
            color: #182235;
        }

        .input-box {
            height: 48px;

            display: flex;
            align-items: center;

            border: 1px solid #dddddd;
            border-radius: 11px;

            background: #ffffff;

            transition: 0.2s ease;
        }

        .input-box:focus-within {
            border-color: #5b5ce2;
            box-shadow: 0 0 0 3px rgba(91, 92, 226, 0.08);
        }

        .input-box > i {
            width: 45px;
            text-align: center;
            color: #8b93a1;
            font-size: 14px;
        }

        .input-box input {
            flex: 1;

            height: 100%;

            border: none;
            outline: none;

            font-family: "Poppins", sans-serif;
            font-size: 13px;

            color: #182235;
            background: transparent;
        }

        .input-box input::placeholder {
            color: #a5abb5;
        }

        /* BUTTON */

        .reset-button {
            width: 100%;
            height: 49px;

            border: none;
            border-radius: 11px;

            background: #5b5ce2;
            color: #ffffff;

            font-family: "Poppins", sans-serif;
            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;

            margin-top: 8px;

            transition: 0.2s ease;
        }

        .reset-button:hover {
            background: #4d4ecf;
            transform: translateY(-1px);
        }

        /* INFO */

        .info-box {
            margin-top: 20px;
            padding: 13px 15px;

            border-radius: 11px;

            background: #f8f6f0;
            color: #7c8494;

            font-size: 11px;
            line-height: 1.6;
        }

        .info-box i {
            color: #5b5ce2;
            margin-right: 5px;
        }

        /* BACK LOGIN */

        .back-login {
            text-align: center;
            margin-top: 22px;
        }

        .back-login a {
            color: #5b5ce2;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
        }

        .back-login a:hover {
            text-decoration: underline;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            body {
                padding: 20px;
            }

            .back-button {
                top: 18px;
                left: 20px;
            }

            .forgot-card {
                padding: 28px 22px;
            }

        }

    </style>

</head>


<body>


    <!-- BACK -->

    <a
        href="parent-login.html"
        class="back-button">

        <i class="fa-solid fa-arrow-left"></i>

        Back to Login

    </a>


    <!-- MAIN -->

    <div class="forgot-container">

        <div class="forgot-card">


            <!-- HEADER -->

            <div class="card-heading">

                <div class="parent-icon">

                    <i class="fa-solid fa-key"></i>

                </div>

                <h2>
                    Forgot Password?
                </h2>

                <p>
                    Enter your parent account details
                    to reset your password.
                </p>

            </div>


            <!-- FORM -->

            <form id="parentForgotPasswordForm">


                <!-- STEP 1 -->

                <div class="step-title">

                    <span class="step-number">
                        1
                    </span>

                    Verify Your Account

                </div>


                <!-- STUDENT ID -->

                <div class="input-group">

                    <label>
                        Linked Student ID
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-id-card"></i>

                        <input
                            type="text"
                            id="studentId"
                            placeholder="Enter linked Student ID"
                            required
                        >

                    </div>

                </div>


                <!-- EMAIL -->

                <div class="input-group">

                    <label>
                        Registered Email Address
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            id="parentEmail"
                            placeholder="Enter registered email"
                            required
                        >

                    </div>

                </div>


                <!-- PHONE -->

                <div class="input-group">

                    <label>
                        Registered Mobile Number
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-phone"></i>

                        <input
                            type="tel"
                            id="parentPhone"
                            placeholder="Enter registered mobile number"
                            maxlength="10"
                            required
                        >

                    </div>

                </div>


                <!-- STEP 2 -->

                <div
                    class="step-title"
                    style="margin-top: 25px;">

                    <span class="step-number">
                        2
                    </span>

                    Create New Password

                </div>


                <!-- NEW PASSWORD -->

                <div class="input-group">

                    <label>
                        New Password
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Enter new password"
                            minlength="6"
                            required
                        >

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="input-group">

                    <label>
                        Confirm New Password
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Re-enter new password"
                            minlength="6"
                            required
                        >

                    </div>

                </div>


                <!-- RESET -->

                <button
                    type="submit"
                    class="reset-button">

                    <span>
                        Reset Password
                    </span>

                    <i class="fa-solid fa-arrow-right"></i>

                </button>


            </form>


            <!-- INFO -->

            <div class="info-box">

                <i class="fa-solid fa-circle-info"></i>

                Please enter the same Student ID, email,
                and mobile number that you used while
                creating your parent account.

            </div>


            <!-- LOGIN -->

            <div class="back-login">

                <a href="parent-login.html">

                    <i class="fa-solid fa-arrow-left"></i>

                    Back to Parent Login

                </a>

            </div>


        </div>

    </div>
<script src="api.js"></script>
<script src="parent-forgot-password.js"></script>
</body>

</html>
