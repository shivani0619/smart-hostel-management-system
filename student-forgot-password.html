<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SmartHostel AI | Student Forgot Password</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #f8f6f0;
            font-family: 'Poppins', sans-serif;
            color: #1c2535;
        }

        .glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            opacity: .35;
            pointer-events: none;
        }

        .glow-one {
            width: 280px;
            height: 280px;
            background: #b8e6e0;
            top: -100px;
            left: -80px;
        }

        .glow-two {
            width: 300px;
            height: 300px;
            background: #d9d4ff;
            right: -100px;
            bottom: -100px;
        }

        .forgot-card {
            position: relative;
            z-index: 2;
            width: min(100%, 500px);
            padding: 38px 34px;
            background: #ffffff;
            border-radius: 22px;
            box-shadow: 0 20px 60px rgba(24, 34, 53, .12);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #1f6f78;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 28px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .heading {
            text-align: center;
            margin-bottom: 28px;
        }

        .student-icon {
            width: 62px;
            height: 62px;
            margin: 0 auto 16px;
            display: grid;
            place-items: center;
            border-radius: 18px;
            background: #e5f6f1;
            color: #1f6f78;
            font-size: 25px;
        }

        .heading h1 {
            margin: 0 0 8px;
            font-size: 26px;
        }

        .heading p {
            margin: 0;
            color: #667085;
            font-size: 14px;
            line-height: 1.6;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
        }

        .input-box {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 48px;
            padding: 0 14px;
            border: 1px solid #d9dee8;
            border-radius: 10px;
            background: #fff;
        }

        .input-box:focus-within {
            border-color: #1f6f78;
            box-shadow: 0 0 0 3px rgba(31, 111, 120, .08);
        }

        .input-box > i {
            color: #7c8494;
            width: 18px;
        }

        .input-box input {
            width: 100%;
            border: 0;
            outline: none;
            font: inherit;
            font-size: 14px;
            color: #1c2535;
            background: transparent;
        }

        .reset-button {
            width: 100%;
            min-height: 50px;
            border: 0;
            border-radius: 10px;
            background: #1f6f78;
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        .reset-button:hover {
            background: #185b63;
        }

        .reset-button:disabled {
            opacity: .65;
            cursor: not-allowed;
        }

        .info-box {
            margin-top: 22px;
            padding: 14px 16px;
            border-radius: 10px;
            background: #f4f7f8;
            color: #667085;
            font-size: 12px;
            line-height: 1.6;
        }

        .info-box i {
            color: #1f6f78;
            margin-right: 6px;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: #667085;
        }

        .login-link a {
            color: #1f6f78;
            font-weight: 600;
            text-decoration: none;
        }

        @media (max-width: 520px) {

            .forgot-card {
                padding: 28px 20px;
            }

            .heading h1 {
                font-size: 23px;
            }

        }

    </style>

</head>

<body>

    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>


    <div class="forgot-card">

        <a href="student-login.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Student Login
        </a>


        <div class="heading">

            <div class="student-icon">
                <i class="fa-solid fa-user-graduate"></i>
            </div>

            <h1>Forgot Password?</h1>

            <p>
                Verify your student account and create a new password.
            </p>

        </div>


        <form id="studentForgotPasswordForm">


            <!-- STUDENT ID -->

            <div class="input-group">

                <label for="studentId">
                    Student ID
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-id-card"></i>

                    <input
                        type="text"
                        id="studentId"
                        placeholder="Enter your Student ID"
                        required
                    >

                </div>

            </div>


            <!-- FULL NAME -->

            <div class="input-group">

                <label for="studentName">
                    Full Name
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        id="studentName"
                        placeholder="Enter your registered name"
                        required
                    >

                </div>

            </div>


            <!-- EMAIL -->

            <div class="input-group">

                <label for="studentEmail">
                    Email Address
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="studentEmail"
                        placeholder="Enter your registered email"
                        required
                    >

                </div>

            </div>


            <!-- PHONE -->

            <div class="input-group">

                <label for="studentPhone">
                    Mobile Number
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-phone"></i>

                    <input
                        type="tel"
                        id="studentPhone"
                        placeholder="Enter your registered mobile number"
                        maxlength="10"
                        required
                    >

                </div>

            </div>


            <!-- NEW PASSWORD -->

            <div class="input-group">

                <label for="newPassword">
                    New Password
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        required
                    >

                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="input-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        required
                    >

                </div>

            </div>


            <!-- RESET -->

            <button
                type="submit"
                class="reset-button">

                <i class="fa-solid fa-key"></i>
                Reset Password

            </button>


        </form>


        <div class="info-box">

            <i class="fa-solid fa-circle-info"></i>

            Enter the same Student ID, name, email and mobile number
            that you used when creating your student account.

        </div>


        <div class="login-link">

            Remember your password?

            <a href="studentlogin.html">
                Back to Student Login
            </a>

        </div>

    </div>


    <script src="api.js"></script>
    <script src="student-forgot-password.js"></script>

</body>

</html>
