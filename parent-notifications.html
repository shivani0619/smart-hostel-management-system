  <style>

    /* ==========================================
       PARENT NOTIFICATIONS
       ========================================== */

    .notification-section {
      background: #ffffff;
      border: 1px solid #eeeeee;
      border-radius: 16px;
      padding: 24px;
    }

    .notification-section-header {
      margin-bottom: 20px;
    }

    .notification-section-header h2 {
      margin: 0;
      font-size: 20px;
      color: #182235;
      font-weight: 600;
    }

    .notification-section-header p {
      margin: 5px 0 0;
      color: #7c8494;
      font-size: 13px;
    }


    /* ==========================================
       NOTIFICATION CARDS
       ========================================== */

    .notification-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .notification-card {
      display: flex;
      align-items: flex-start;
      gap: 15px;
      padding: 18px;
      border: 1px solid #eeeeee;
      border-radius: 14px;
      background: #ffffff;
      transition: transform 0.2s ease,
                  box-shadow 0.2s ease;
    }

    .notification-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 20px rgba(24, 34, 53, 0.07);
    }


    /* ==========================================
       ICON
       ========================================== */

    .notification-icon {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 18px;
    }

    .notification-icon.leave-approved {
      background: #eaf8ef;
      color: #23824a;
    }

    .notification-icon.leave-request {
      background: #fff4df;
      color: #b76b00;
    }

    .notification-icon.visitor {
      background: #f0efff;
      color: #5b5ce2;
    }

    .notification-icon.emergency {
      background: #fff0f0;
      color: #d64545;
    }

    .notification-icon.default {
      background: #f1f3f5;
      color: #596273;
    }


    /* ==========================================
       CONTENT
       ========================================== */

    .notification-content {
      flex: 1;
      min-width: 0;
    }

    .notification-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .notification-title {
      margin: 0;
      color: #182235;
      font-size: 15px;
      font-weight: 600;
    }

    .notification-time {
      color: #9aa1ad;
      font-size: 11px;
      white-space: nowrap;
    }

    .notification-message {
      margin: 7px 0 0;
      color: #596273;
      font-size: 13px;
      line-height: 1.65;
    }


    /* ==========================================
       EMERGENCY NOTIFICATION
       ========================================== */

    .notification-card.emergency-alert {
      border-color: #f2cccc;
      background: #fffafa;
    }

    .notification-card.emergency-alert .notification-title {
      color: #c03939;
    }


    /* ==========================================
       EMPTY STATE
       ========================================== */

    .notification-empty {
      text-align: center;
      padding: 45px 20px;
      color: #7c8494;
      font-size: 14px;
    }

    .notification-empty i {
      display: block;
      font-size: 32px;
      margin-bottom: 12px;
      color: #b8bec8;
    }


    /* ==========================================
       RESPONSIVE
       ========================================== */

    @media (max-width: 650px) {

      .notification-section {
        padding: 18px;
      }

      .notification-card {
        padding: 15px;
      }

      .notification-header {
        flex-direction: column;
        gap: 4px;
      }

      .notification-time {
        white-space: normal;
      }

    }

  </style>
</head>
